services:
  identity-db:
    image: docker.io/library/postgres:18.6-alpine3.23
    container_name: identity-postgres

    environment:
      POSTGRES_DB: ${IDENTITY_DB_NAME}
      POSTGRES_USER: ${IDENTITY_DB_USER}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD}

    ports:
      - "127.0.0.1:${IDENTITY_DB_PORT:-5433}:5432"

    volumes:
      - identity_pg_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  keycloak-db-init:
    image: docker.io/library/postgres:18.6-alpine3.23
    container_name: identity-keycloak-db-init

    depends_on:
      identity-db:
        condition: service_healthy

    environment:
      PGHOST: identity-db
      PGPORT: 5432
      PGUSER: ${IDENTITY_DB_USER}
      PGPASSWORD: ${IDENTITY_DB_PASSWORD}

      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_password}

    entrypoint: ["/bin/sh", "-c"]

    command:
      - |
        set -eu

        echo "Initializing Keycloak database..."

        psql -d postgres -v ON_ERROR_STOP=1 \
          -v kc_user="$$KEYCLOAK_DB_USER" \
          -v kc_pass="$$KEYCLOAK_DB_PASSWORD" \
          -v kc_db="$$KEYCLOAK_DB_NAME" <<'SQL'

        SELECT format(
          'CREATE ROLE %I LOGIN PASSWORD %L',
          :'kc_user',
          :'kc_pass'
        )
        WHERE NOT EXISTS (
          SELECT 1
          FROM pg_roles
          WHERE rolname = :'kc_user'
        )
        \gexec

        SELECT format(
          'ALTER ROLE %I WITH LOGIN PASSWORD %L',
          :'kc_user',
          :'kc_pass'
        )
        \gexec

        SELECT format(
          'CREATE DATABASE %I OWNER %I',
          :'kc_db',
          :'kc_user'
        )
        WHERE NOT EXISTS (
          SELECT 1
          FROM pg_database
          WHERE datname = :'kc_db'
        )
        \gexec

        SQL

        echo "Keycloak database initialized successfully."

    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: hanyang-keycloak

    depends_on:
      identity-db:
        condition: service_healthy
      keycloak-db-init:
        condition: service_completed_successfully

    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: identity-db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_password}

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}

      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

    command: ["start-dev"]

    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-18080}:8080"

    restart: unless-stopped

volumes:
  identity_pg_data: