spring:
  application:
    name: identity-service-v4-mono

  datasource:
    url: jdbc:postgresql://localhost:${IDENTITY_DB_PORT:25434}/${IDENTITY_DB_NAME:identity_db}
    username: ${IDENTITY_DB_USER:identity_user}
    password: ${IDENTITY_DB_PASSWORD:identity_dev_password}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:18500}

      discovery:
        register: true
        register-health-check: false
  data:
    redis:
      host: ${REDIS_HOST:redis-18858.crce272.asia-seast1-1.gcp.cloud.redislabs.com}
      port: ${REDIS_PORT:18858}
      connect-timeout: 5s
      timeout: 5s
      repositories:
        enabled: false
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:V6Guaqp9U039dUGQtz8n3c5i1NM1XrZ9}
server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: when-authorized

  health:
    ldap:
      enabled: ${DS389_ENABLED:true}
integration:
  keycloak:
    server-url: ${KEYCLOAK_URL:http://localhost:18080}
    realm: ${KEYCLOAK_REALM:hanyang}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:identity-service-admin}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}

    ldap-federation:
      enabled: ${KEYCLOAK_LDAP_FEDERATION_ENABLED:true}
      name: ${KEYCLOAK_LDAP_FEDERATION_NAME:hanyang-389ds}
      connection-url: ${KEYCLOAK_LDAP_CONNECTION_URL:ldap://host.containers.internal:3389}
      edit-mode: ${KEYCLOAK_LDAP_EDIT_MODE:WRITABLE}
      require-tls: ${KEYCLOAK_LDAP_REQUIRE_TLS:false}

  ds389:
    enabled: ${DS389_ENABLED:true}
    url: ${DS389_URL:ldap://localhost:3389}
    base-dn: ${DS389_BASE_DN:dc=hanyang,dc=local}
    bind-dn: ${DS389_BIND_DN:cn=Directory Manager}
    bind-password: ${DS389_BIND_PASSWORD:change_me}
    people-ou: ${DS389_PEOPLE_OU:ou=People}
    require-tls: ${DS389_REQUIRE_TLS:false}

outbox:
  worker:
    enabled: ${OUTBOX_WORKER_ENABLED:true}
    fixed-delay-ms: ${OUTBOX_WORKER_FIXED_DELAY_MS:1000}
    batch-size: ${OUTBOX_WORKER_BATCH_SIZE:20}
    max-attempts: ${OUTBOX_WORKER_MAX_ATTEMPTS:8}
    initial-backoff: ${OUTBOX_WORKER_INITIAL_BACKOFF:2s}
    max-backoff: ${OUTBOX_WORKER_MAX_BACKOFF:5m}
    processing-timeout: ${OUTBOX_WORKER_PROCESSING_TIMEOUT:5m}

operations:
  provisioning-health:
    stale-after: ${PROVISIONING_HEALTH_STALE_AFTER:15m}
    provider-probe-enabled: ${PROVISIONING_HEALTH_PROVIDER_PROBE_ENABLED:true}
employee:
  national-identity:
    protection:
      encryption-key: ${EMPLOYEE_NATIONAL_ID_ENCRYPTION_KEY:oNfOz/byhtc9qp2mYugJEg7oOeCN+CMM4DIRi8EHY/I=}
      fingerprint-key: ${EMPLOYEE_NATIONAL_ID_FINGERPRINT_KEY:alnASeKt27Yp6TjkZgP904xgWxx907qHFyPnyPve10Q=}
security:
  access-revocation:
    # Phải >= access-token lifespan lớn nhất + safety margin.
    # Ví dụ access token 5m => giữ revoked sid 6m.
    session-retention: ${ACCESS_REVOCATION_SESSION_RETENTION:6m}
    key-prefix: ${ACCESS_REVOCATION_KEY_PREFIX:hanyang:security:revocation}

  oidc:
    backchannel-logout:
      issuer: ${OIDC_ISSUER:http://localhost:18080/realms/hanyang}
      allowed-audiences:
        - ${OIDC_WEB_CLIENT_ID:hanyang-web}